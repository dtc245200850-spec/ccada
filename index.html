<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery - Bootstrap</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Tùy chỉnh nhẹ cho các khung ảnh */
        .gallery-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-light py-5">

    <div class="container">
        <!-- Tiêu đề Gallery -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">Bộ Sưu Tập Ảnh (Gallery)</h1>
            <p class="text-muted">Luyện tập sử dụng Grid System trong Bootstrap</p>
        </div>

        <!-- Lưới ảnh Bootstrap Grid -->
        <div class="row g-4">
            
            <!-- Ảnh 1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://picsum.photos/400/300?random=1" class="gallery-img card-img-top" alt="Ảnh 1">
                    <div class="card-body text-center">
                        <h5 class="card-title text-secondary fs-6">Hình ảnh 1</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 2 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://picsum.photos/400/300?random=2" class="gallery-img card-img-top" alt="Ảnh 2">
                    <div class="card-body text-center">
                        <h5 class="card-title text-secondary fs-6">Hình ảnh 2</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 3 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://picsum.photos/400/300?random=3" class="gallery-img card-img-top" alt="Ảnh 3">
                    <div class="card-body text-center">
                        <h5 class="card-title text-secondary fs-6">Hình ảnh 3</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 4 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://picsum.photos/400/300?random=4" class="gallery-img card-img-top" alt="Ảnh 4">
                    <div class="card-body text-center">
                        <h5 class="card-title text-secondary fs-6">Hình ảnh 4</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 5 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://picsum.photos/400/300?random=5" class="gallery-img card-img-top" alt="Ảnh 5">
                    <div class="card-body text-center">
                        <h5 class="card-title text-secondary fs-6">Hình ảnh 5</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 6 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://picsum.photos/400/300?random=6" class="gallery-img card-img-top" alt="Ảnh 6">
                    <div class="card-body text-center">
                        <h5 class="card-title text-secondary fs-6">Hình ảnh 6</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 7 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://picsum.photos/400/300?random=7" class="gallery-img card-img-top" alt="Ảnh 7">
                    <div class="card-body text-center">
                        <h5 class="card-title text-secondary fs-6">Hình ảnh 7</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 8 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://picsum.photos/400/300?random=8" class="gallery-img card-img-top" alt="Ảnh 8">
                    <div class="card-body text-center">
                        <h5 class="card-title text-secondary fs-6">Hình ảnh 8</h5>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
